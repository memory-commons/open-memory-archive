      border-style: dashed;
      background: color-mix(in srgb, CanvasText 6%, Canvas 94%);

      display: inline-block;

      padding: .18rem .55rem;

      font-weight: 800;
      letter-spacing: .04em;

    .redaction-reason {

      color: color-mix(in srgb, CanvasText 66%, transparent);
      font-size: .9rem;
      font-style: italic;
    }
    .redaction-hint {
      margin-top: .2rem;
      color: color-mix(in srgb, CanvasText 58%, transparent);
      font-size: .85rem;
    }
    .section {
      margin: 1rem 0 1.25rem;
      line-height: 1.65;
    }
    .section.redacted {
      border: 1px dashed color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 8px;
      padding: .85rem;
    }
    details {
      margin: 1.5rem 0;
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 8px;
      padding: .85rem 1rem;
      background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
    }
    summary {
      cursor: pointer;
      font-weight: 700;
    }
    details[open] summary {
      margin-bottom: .75rem;
    }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    a { color: LinkText; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      color: color-mix(in srgb, CanvasText 66%, transparent);
      font-size: .92rem;
    }
    footer a { color: LinkText; }
  </style>
</head>
<body>

  <script>
    const { archiveData, manifest } = JSON.parse(document.getElementById('archive-data').textContent);
    const app = document.getElementById('app');
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const redactionMap = {};
    const reasonLabels = {
      private_scope: 'Redacted: marked as private or family-only',
      withdrawn_consent: 'Redacted: consent was withdrawn',
      living_person: 'Redacted: living person, consent not confirmed',
      special_category: 'Redacted: contains special category data',
      operator_policy: 'Redacted: removed by operator policy',
      source_unavailable: 'Redacted: source material unavailable',
    };
    (archiveData.redactions || []).forEach((redaction) => {
      if (redaction?.path) redactionMap[redaction.path] = redaction;
    });
    const redactionInfo = (path) => redactionMap[path] || null;
    const redactedLabel = (item) => item?.redacted ? '<div class="redacted-label">[REDACTED]</div>' : '';
    const redactionReason = (item, path) => {
      if (!item?.redacted) return '';
      const info = redactionInfo(path);
      if (!info?.reason) return '';
      const label = reasonLabels[info.reason] || 'Redacted: ' + String(info.reason).replace(/_/g, ' ');
      return '<div class="redaction-reason">' + esc(label) + '</div><div class="redaction-hint">Original details can remain in a private or family-only source; this public archive keeps only the placeholder.</div>';
    };
    const card = (body, item, path) => '<article class="card ' + (item?.redacted ? 'redacted' : '') + '">' + redactedLabel(item) + body + redactionReason(item, path) + '</article>';
    const list = (title, items, collectionName, render) => '<section><h2>' + esc(title) + '</h2><div class="grid">' + (items || []).map((item, index) => render(item, '$.' + collectionName + '[' + index + ']')).join('') + '</div></section>';
    const sectionHtml = (section, chapterIndex, sectionIndex) => {
      const path = '$.chapters[' + chapterIndex + '].sections[' + sectionIndex + ']';
      return '<div class="section ' + (section?.redacted ? 'redacted' : '') + '">' + redactedLabel(section) + '<h3>' + esc(section.title || '') + '</h3><p>' + esc(section.text || '') + '</p>' + redactionReason(section, path) + '</div>';
    };
    const chapters = (archiveData.chapters || []).map((chapter, chapterIndex) => {
      const chapterPath = '$.chapters[' + chapterIndex + ']';
      return '<section class="' + (chapter?.redacted ? 'redacted section' : '') + '">' + redactedLabel(chapter) + '<h2>' + esc(chapter.title) + '</h2>' + redactionReason(chapter, chapterPath) + (chapter.sections || []).map((section, sectionIndex) => sectionHtml(section, chapterIndex, sectionIndex)).join('') + '</section>';
    }).join('');
    const redactions = Number(manifest.privacy?.redactionCount || 0);
    const redactionWord = redactions === 1 ? 'item was' : 'items were';
    const about = '<details open><summary>About privacy redaction in this archive</summary><p>' + redactions + ' ' + redactionWord + ' redacted. Source items marked as family-only, private, or with withdrawn consent are replaced with placeholders. Private text and media files are not written into this archive.</p><p><a href="../privacy-redaction-demo.html">Read the full explanation →</a></p></details>';
    const manifestDetails = '<details><summary>Archive Manifest (machine-readable)</summary><pre>' + esc(JSON.stringify(manifest, null, 2)) + '</pre></details>';

    app.innerHTML = [
      chapters,
      list('People', archiveData.people, 'people', (person, path) => card('<strong>' + esc(person.displayName) + '</strong><p>' + esc(person.description || person.biography || '') + '</p>', person, path)),
      list('Events', archiveData.events, 'events', (event, path) => card('<strong>' + esc(event.title) + '</strong><p>' + esc(event.date || '') + '</p><p>' + esc(event.description || '') + '</p>', event, path)),
      list('Locations', archiveData.locations, 'locations', (location, path) => card('<strong>' + esc(location.name) + '</strong><p>' + esc([location.region, location.country].filter(Boolean).join(', ')) + '</p>' + (location.description ? '<p>' + esc(location.description) + '</p>' : ''), location, path)),
      list('Media', archiveData.media, 'media', (media, path) => card('<strong>' + esc(media.title || media.id) + '</strong>' + (media.description ? '<p>' + esc(media.description) + '</p>' : '') + (media.localPath ? '<p><a href="' + esc(media.localPath) + '">' + esc(media.localPath) + '</a></p>' : '<p>Media unavailable in this privacy profile.</p>'), media, path)),
      about,
      manifestDetails,
      footer
    ].join('');
  </script>
